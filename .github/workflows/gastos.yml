name: Atualizar gastos

# Cota parlamentar de deputados (CEAP) e senadores (CEAPS) desde 2023. Baixa os arquivos anuais oficiais,
# guarda só o resumo de cada parlamentar e publica o site. Todo dia de madrugada e à mão.
on:
  schedule:
    - cron: "47 6 * * *" # 03:47 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Coletar gastos
        run: python -m coletor.gastos

      - name: Resumo
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("dados/gastos")
          est = json.loads((p / "estado.json").read_text()) if (p / "estado.json").exists() else {}
          for casa, nome in (("camara", "Câmara"), ("senado", "Senado")):
              print(f"## {nome}\n\n| Ano | Despesas | Total (R$) | Fonte |\n|---|---|---|---|")
              for ano, e in sorted(est.get(casa, {}).items()):
                  if "erro" in e: print(f"| {ano} | erro | | {e['erro'][:150]} |")
                  else: print(f"| {ano} | {e['despesas']:,} | {e['total']:,.2f} | {e['fonte']} |")
              print(f"\nParlamentares com resumo: {len(list((p / casa).glob('*.json')))}\n")
          EOF

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then echo "Nada novo."; else
            git commit -m "dados: gastos"
            git pull --rebase
            git push
          fi

  publicar:
    needs: coletar
    uses: ./.github/workflows/publicar.yml
